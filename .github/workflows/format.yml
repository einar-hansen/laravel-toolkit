name: Formatting

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    name: Run Laravel Pint & Rector
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Create cache directory
        run: mkdir -p /tmp/format

      - name: Cache Rector objects
        uses: actions/cache@v4
        with:
          path: /tmp/format
          key: ${{ runner.os }}-format-${{ hashFiles('pint.json', 'rector.php', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-format-

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test --cache-file=/tmp/format/pint.json

      - name: Run Rector
        run: ./vendor/bin/rector process --dry-run --ansi

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check namespaces
        run: composer dump-autoload --optimize --strict-psr